# Cross-compile the reconstruction to 32-bit Windows x86 — the shipped
# binary's architecture (LegoRR.exe image base 0x400000, DX6-era). See
# docs/adr/0001.
#
# Toolchain: i686-w64-mingw32-* on PATH. Fedora/Bazzite (immutable): use a
# distrobox/podman Fedora container with `dnf install mingw32-gcc
# mingw32-binutils`. Debian/Ubuntu: `apt install gcc-mingw-w64-i686
# binutils-mingw-w64-i686`. Adjust the names below to your distro's prefix.
#
# CRT: left at the distro toolchain default (msvcrt for i686 mingw-w64),
# matching the shipped runtime — see ADR 0001 Q13.

[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
windres = 'i686-w64-mingw32-windres'
strip = 'i686-w64-mingw32-strip'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[built-in options]
c_std = 'c99'