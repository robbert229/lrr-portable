# SPDX-License-Identifier: LGPL-3.0-or-later
#
# The native port on macOS (arm64 and Intel), FreeBSD, and Windows (MSVC x86,
# x64 and arm64, and msys2 MinGW64), the web build (Emscripten), the
# Nintendo 3DS build (devkitARM) and Android (Gradle). These
# jobs are not required checks: native-build is the only one. Each native
# job configures, builds and runs ctest as native-build does, with SDL3
# fetched by CMake at the pinned commit (CMakeLists.txt, LRR_SDL3_GIT_TAG);
# the web job builds LegoRR.html, .js and .wasm and uploads them, and the 3DS
# job LegoRR.3dsx and LegoRR.cia. The Python
# tool tests and the unit lint run in native-build only. The macOS and
# Windows jobs also build the CPack package (packaging/), check its contents
# with tools/check_package.py and upload it as an artifact; the Linux packages
# are in native-packages. The Android job builds the debug APK
# (packaging/android) and uploads it. release.yml calls this workflow for a
# release.
name: native-hosts

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow (release.yml) calls this one to build its packages.
  workflow_call:

permissions:
  contents: read

# A call from release.yml runs under that workflow's name, so it never
# shares, or cancels, this workflow's own run for the same ref.
concurrency:
  group: native-hosts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'macos-arm64', os: 'macos-latest' }
          - { name: 'macos-intel', os: 'macos-15-intel' }
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: brew install ninja

      - name: Bootstrap sparse miniwin
        run: tools/setup-miniwin.sh

      - name: Configure, build, and test
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
          ctest --test-dir build --output-on-failure

      # LegoRR.app in a disk image (packaging/macos): ad-hoc signed, not
      # notarized. verify.sh mounts the image and checks the bundle. The ZIP
      # of the same app, with recomplauncher.json beside it, is the one
      # RecompLauncher installs; ditto unpacks it as the launcher would.
      - name: Package (DMG and ZIP)
        run: |
          cmake --build build --target package
          packaging/macos/verify.sh build/dist/lrr-portable-*-Darwin-*.dmg
          python3 tools/check_package.py --require recomplauncher.json \
            --require LegoRR build/dist/lrr-portable-*-Darwin-*.zip
          unzipped="$RUNNER_TEMP/lrr-portable-zip"
          ditto -x -k build/dist/lrr-portable-*-Darwin-*.zip "$unzipped"
          codesign --verify --deep --strict --verbose=2 "$unzipped"/*/LegoRR.app
          test -x "$unzipped"/*/LegoRR.app/Contents/MacOS/LegoRR

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/dist/lrr-portable-*.dmg
            build/dist/lrr-portable-*.zip
          if-no-files-found: error

  freebsd:
    name: freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure, build, and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y bash cmake ninja git pkgconf xorg alsa-lib
          run: |
            set -e
            git config --global --add safe.directory '*'
            tools/setup-miniwin.sh
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            ctest --test-dir build --output-on-failure

  windows-msvc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 runs on the x64 runner under WOW64; arm64 on the arm64 runner.
          - { name: 'windows-msvc-x86', os: 'windows-2025', msvc-arch: 'amd64_x86' }
          - { name: 'windows-msvc-x64', os: 'windows-2025', msvc-arch: 'amd64' }
          - { name: 'windows-msvc-arm64', os: 'windows-11-arm', msvc-arch: 'arm64' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Bootstrap sparse miniwin
        run: tools/setup-miniwin.sh

      - name: Configure, build, and test
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        # pwsh: Git Bash's /usr/bin/link would shadow MSVC's link.exe.
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The licence, the notices and the Visual C++ runtime DLLs are inside,
      # and nothing off tools/check_package.py's allow-list.
      - name: Check the package
        run: python tools/check_package.py --require vcruntime140.dll --require msvcp140.dll build/dist/lrr-portable-*.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/dist/lrr-portable-*.zip
          if-no-files-found: error

  windows-mingw64:
    name: windows-mingw64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3

      - name: Bootstrap sparse miniwin
        run: tools/setup-miniwin.sh

      - name: Configure, build, and test
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --build build --target package

      - name: Check the package
        shell: bash
        run: python tools/check_package.py build/dist/lrr-portable-*.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw64
          path: build/dist/lrr-portable-*.zip
          if-no-files-found: error

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up emsdk
        # The Emscripten release isle-portable builds its web port with.
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Bootstrap sparse miniwin
        run: tools/setup-miniwin.sh

      - name: Configure and build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        # The tests are native programs (several use GNU ld's --wrap); the
        # web job builds the game only.
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web --target program
          ls -l build-web/LegoRR.html build-web/LegoRR.js build-web/LegoRR.wasm

      - name: Upload LegoRR.html, .js and .wasm
        uses: actions/upload-artifact@v4
        with:
          name: LegoRR-web
          path: |
            build-web/LegoRR.html
            build-web/LegoRR.js
            build-web/LegoRR.wasm
          if-no-files-found: error

  nintendo-3ds:
    name: nintendo-3ds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # devkitPro's devkitARM image, as isle-portable builds its 3DS port, at
    # the digest the build was checked with (devkitpro/devkitarm:latest on
    # 2026-11-21).
    container: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install bannertool and makerom
        # The .cia's tools, the releases isle-portable's CI downloads,
        # checked against their SHA-256.
        run: |
          cd /tmp
          curl -fsSLO https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          curl -fsSLO https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          sha256sum -c - <<'SUMS'
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          c6f8aafba8f1cdb403929719c95173cada707cd9ceacfa2bec5118f8f96c6f8a  makerom-v0.18-ubuntu_x86_64.zip
          SUMS
          unzip -j bannertool.zip linux-x86_64/bannertool -d /opt/devkitpro/tools/bin
          unzip makerom-v0.18-ubuntu_x86_64.zip makerom -d /opt/devkitpro/tools/bin
          chmod a+x /opt/devkitpro/tools/bin/bannertool /opt/devkitpro/tools/bin/makerom

      - name: Bootstrap sparse miniwin
        # The container runs as root over a workspace the runner owns, which
        # git refuses as dubious ownership, here and in the configure step's
        # patch check.
        run: |
          git config --global --add safe.directory '*'
          tools/setup-miniwin.sh

      - name: Configure and build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        # The tests are native programs; the 3DS job builds the game and its
        # packages only.
        run: |
          cmake -S . -B build-3ds -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake
          cmake --build build-3ds
          ls -l build-3ds/LegoRR.3dsx build-3ds/LegoRR.cia

      - name: Upload LegoRR.3dsx and LegoRR.cia
        uses: actions/upload-artifact@v4
        with:
          name: LegoRR-3ds
          path: |
            build-3ds/LegoRR.3dsx
            build-3ds/LegoRR.cia
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      # gradlew runs the wrapper jar committed in packaging/android; check it
      # against Gradle's published checksums before running it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The NDK and CMake app/build.gradle pins (ndkVersion, cmake version).
      # The image carries both; sdkmanager installs them, checked against
      # the SDK repository's checksums, if a later image drops them. Gradle
      # itself is checked by the wrapper (distributionSha256Sum) and SDL's
      # AAR by build.gradle (sdlDevelSha256).
      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.31.5"

      - name: Bootstrap sparse miniwin
        run: tools/setup-miniwin.sh

      - name: Build the debug APK
        working-directory: packaging/android
        run: ./gradlew --no-daemon assembleDebug

      # The licence and notices inside, nothing off the allow-list.
      - name: Check the debug APK
        run: python3 tools/check_package.py packaging/android/app/build/outputs/apk/debug/app-debug.apk

      # Debug-signed (Android's debug key), for testing: see
      # docs/building.md, "Android", for the game data and signing.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LegoRR-android-debug
          path: packaging/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
