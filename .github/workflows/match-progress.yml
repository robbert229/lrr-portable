name: matching-progress
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: matching-progress-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  freshness:
    name: matching-progress-freshness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Verify committed measurement
        run: python3 head/tools/pr_match_progress.py check --base base --head head
  comment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Render report
        run: python3 head/tools/pr_match_progress.py render --base base --head head > "$RUNNER_TEMP/match-comment.md"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/match-comment.md`, 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('<!-- matching-progress-report -->'));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
