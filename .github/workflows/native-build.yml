#
# Required check: builds the native port and runs its synthetic-fixture tests.
# main has no matching build; it is on the decomp branch (ADR 0007).
name: native-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Test the Python tools
        run: python3 -m unittest discover -s tools/tests

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config

      - name: Set up SDL3
        # The pinned release, built headless and cached (.github/actions/setup-sdl3).
        uses: ./.github/actions/setup-sdl3

      - name: Bootstrap sparse miniwin
        # Fetches only 3rdparty/isle-portable/miniwin/, never the full submodule,
        # and applies patches/miniwin on top (ADR 0009).
        run: tools/setup-miniwin.sh

      - name: Lint the units
        # ADR 0007: the units take one branch (no backend or compiler guards)
        # and call DirectX through miniwin's C++ interfaces (no lpVtbl).
        run: |
          if grep -rnE '^\s*#\s*(if|elif|ifdef|ifndef).*(LEGORRR_BACKEND_|MINIWIN|_MSC_VER|_M_IX86|_WIN32)' src ||
             grep -rn 'lpVtbl' src; then
            echo "A unit has a backend or compiler guard, or an lpVtbl call" >&2
            exit 1
          fi

      - name: Configure, build, and test
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
